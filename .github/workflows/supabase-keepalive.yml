name: Supabase keep-alive

# Pings the PostgREST API daily so the free-tier project never hits
# the 7-day inactivity threshold and gets auto-paused.
#
# More reliable than Vercel crons for this use-case.
# Manual "Run workflow" button available in the Actions tab on GitHub.
#
# Required secret: CRON_SECRET (Settings → Secrets → Actions)
# Must match the CRON_SECRET env var set in Vercel.

on:
  schedule:
    - cron: '0 10 * * *'   # Daily at 10:00 UTC
  workflow_dispatch:         # Manual trigger button in GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          echo "Pinging Supabase keep-alive at $(date -u)"
          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://emo-training.vercel.app/api/cron/keep-alive)
          BODY=$(cat /tmp/body.txt)
          echo "HTTP status: $STATUS"
          echo "Response: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Keep-alive failed — HTTP $STATUS"
            exit 1
          fi
          echo "✅ Supabase is alive"
